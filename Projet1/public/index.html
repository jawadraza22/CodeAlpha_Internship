<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJR Bazar | Premium E-commerce</title>
    <meta name="description" content="Discover premium products at MJR Bazar.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo" data-link>
                <img src="/images/logo.png" alt="MJR Bazar Logo" style="height: 40px; display: block; object-fit: contain;">
            </a>
            <div class="nav-links">
                <a href="/" data-link>Home</a>
                <a href="/products" data-link>Shop</a>
                <a href="/about" data-link>About Us</a>
                <a href="/faq" data-link>FAQ</a>
                <a href="/contact" data-link>Contact Us</a>
            </div>
            <div class="nav-actions">
                <div class="user-menu" id="userMenu">
                    <!-- Dynamic auth links -->
                </div>
                <a href="/cart" class="cart-icon" data-link>
                    <i data-lucide="shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main id="app-content">
        <!-- Content injected by JS -->
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>MJR Bazar</h3>
                <p>Elevate your lifestyle with our premium curated products.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <a href="/about" data-link>About Us</a>
                <a href="/products" data-link>Shop</a>
                <a href="/cart" data-link>Cart</a>
            </div>
            <div class="footer-section">
                <h4>Support</h4>
                <a href="/contact" data-link>Contact Us</a>
                <a href="/shipping" data-link>Shipping Policy</a>
                <a href="/faq" data-link>FAQ</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 MJR Bazar. All rights reserved.</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
</body>
</html>
