<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fa-solid fa-bolt"></i> Vibe</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="auth-container">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn auth-btn">Login</button>
    </form>
    <div class="auth-links">
      Don't have an account? <a href="register.html">Sign up</a>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-logo"><i class="fa-solid fa-bolt"></i> Vibe</div>
      <div class="copyright">&copy; 2026 Vibe Social Media App.</div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
